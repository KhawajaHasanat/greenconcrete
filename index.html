<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Green Concrete Company</title>
  <meta name="description" content="Green Concrete Company — Legal documents, privacy policy and terms of service." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #16a34a;
      --green-dark: #14532d;
      --green-light: #dcfce7;
      --bg: #0a0f0d;
      --surface: #111b14;
      --border: #1e2d22;
      --text: #f0fdf4;
      --muted: #86efac;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .logo {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, var(--green), #4ade80);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.5rem;
      box-shadow: 0 0 40px rgba(22,163,74,0.4);
    }
    h1 { font-size: 2.2rem; font-weight: 700; text-align: center; }
    p { color: var(--muted); margin-top: 0.75rem; text-align: center; font-size: 1.05rem; }
    .cards {
      display: flex; gap: 1rem; margin-top: 2.5rem; flex-wrap: wrap; justify-content: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem 2rem;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s;
      min-width: 200px;
      text-align: center;
    }
    .card:hover {
      border-color: var(--green);
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(22,163,74,0.2);
    }
    .card .icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .card h3 { font-size: 1rem; font-weight: 600; }
    .badge {
      display: inline-block;
      background: rgba(22,163,74,0.15);
      color: #4ade80;
      border: 1px solid rgba(74,222,128,0.3);
      border-radius: 999px;
      padding: 0.25rem 0.9rem;
      font-size: 0.78rem;
      font-weight: 500;
      margin-top: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="logo">🏗️</div>
  <h1>Green Concrete Company</h1>
  <p>WhatsApp Business Communication System</p>
  <span class="badge">✅ Meta WhatsApp API Verified</span>
  <div class="cards">
    <a class="card" href="privacy-policy.html">
      <div class="icon">🔒</div>
      <h3>Privacy Policy</h3>
    </a>
    <a class="card" href="terms.html">
      <div class="icon">📄</div>
      <h3>Terms of Service</h3>
    </a>
  </div>
</body>
</html>
